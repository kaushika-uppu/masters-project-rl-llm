# RL from an SFT checkpoint: GRPO starting from the pushed SFT model.
# Run: python -m src.training.run src/training/configs/rl_from_sft.yaml
#  or: sbatch slurm/rl_from_sft.sbatch

model:
  # Pushed SFT checkpoint (output of the sft.yaml run, subset 1-2 rollouts correct).
  from_checkpoint: "checkpoints/sft_run_subset_1_2/checkpoint-280"
  is_peft_checkpoint: true          # the SFT run trained LoRA adapters (see configs/sft.yaml)
  torch_dtype: "bfloat16"
  # Pin the WHOLE policy to GPU 0. With --gres=gpu:2, "auto" would shard the policy across
  # BOTH cards and collide with the judge on cuda:1 (and "auto" can break backprop for this
  # hand-rolled single-process trainer). Judge + embedder go to GPU 1 (see rl section).
  device_map: {"": 0}

# NOTE: no `lora` section here. When loading a PEFT checkpoint, run.py keeps the
# existing adapters trainable instead of attaching new ones.

rl:
  method: "grpo_tree"
  output_dir: "checkpoints/rl_tree_from_sft"
  problems_path: "data/rl_problems.jsonl"   # provided externally: {id, statement, label, reference?}
  max_problems: null
  temperature: 0.8
  save_every: 50          # checkpoint every N updates (survives SLURM wall-time/preemption)

  judge_model: "Qwen/Qwen2.5-7B-Instruct"   # in-process judge; swap/fine-tune later
  judge_load_in_4bit: true                  # 4-bit keeps the judge small (~5GB)
  judge_device: "cuda:1"                    # judge on the 2nd GPU, off the policy's card

  # Node merging: semantic (embedding cosine) so states phrased differently still merge.
  merge:
    semantic: true
    embed_model: "sentence-transformers/all-MiniLM-L6-v2"   # small in-process embedder
    cosine_threshold: 0.9   # >= this cosine => same state (raise to under-merge)
    device: "cuda:1"  # embedder on GPU 1 too (off the policy card); use "cpu" if preferred

  tree:
    group_size: 8
    max_depth: 8
    retry_budget: 2
    kl_coef: 0.05
    lr: 1.0e-6
    epochs: 1
    batch_problems: 4
    base_weight: 0.1
    num_workers: 1     # >1 parallelizes trees across problems; safe only with a
                       # served/replicated backend or one model per worker (see grpo_tree.py)
    grad_checkpointing: true   # recompute activations in backward; big memory saving in _update
    max_score_tokens: 4096     # skip scoring sequences longer than this (0 = disabled)