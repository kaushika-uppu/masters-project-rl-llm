# config for SFT with subset of 1-2 rollouts correct

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: "bfloat16"
  device_map: {"": 0}

lora:
  r: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  dropout: 0.05
  bias: "none"

sft:
  dataset: "data/sft_reference_training.jsonl" 
  output_dir: "checkpoints/sft_v2_combined"
  num_train_epochs: 1
  warmup_steps: 25
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1e-5
  max_length: 4096